[base]
package = ocean
env_name = puffer_galaga
policy_name = Policy
rnn_name = Recurrent

[vec]
; M4 Pro: 14 physical cores, 1 worker per core, no oversubscription
num_envs = 14
num_workers = 14
overwork = False

[env]
num_envs = 2048
width = 1024
height = 768
frameskip = 1

[train]
device = mps
total_timesteps = 1_000_000_000
learning_rate = 0.005
adam_beta1 = 0.975
adam_beta2 = 0.9999
adam_eps = 1e-07
anneal_lr = true
batch_size = auto
bptt_horizon = 64
clip_coef = 0.2
ent_coef = 0.002
gae_lambda = 0.84
gamma = 0.999
max_grad_norm = 0.75
minibatch_size = 8192
update_epochs = 1
vf_clip_coef = 0.1
vf_coef = 3.0
