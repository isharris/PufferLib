[package]
name = "pufferlib_bindings"
version = "3.0.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
name = "bindings"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
rand = "0.8"

[build-dependencies]
cc = "1"

[profile.release]
lto = true
codegen-units = 1
