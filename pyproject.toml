[project]
name = "pufferlib"
version = "3.0.0"
description = "Fast and sane reinforcement learning"
requires-python = ">=3.9"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
authors = [{ name = "Joseph Suarez", email = "jsuarez@puffer.ai" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy<2.0",
    "shimmy[gym-v21]",
    "gym==0.23",
    "gymnasium>=0.29.1",
    "pettingzoo>=1.24.1",
    "torch",
    "psutil",
    "nvidia-ml-py",
    "rich",
    "rich_argparse",
    "imageio",
    "gpytorch",
    "scikit-learn",
    "heavyball>=2.2.0",
    "neptune",
    "wandb",
]

[project.optional-dependencies]
box2d = [
    "gymnasium[box2d]==0.29.1",
    "swig==4.1.1",
]
classic_control = [
    "gym==0.23",
    "gymnasium==0.29.1",
]
ray = [
    "ray==2.23.0",
]
cleanrl = [
    "stable_baselines3==2.1.0",
    "tensorboard==2.11.2",
    "tyro==0.8.6",
]

[project.scripts]
puffer = "pufferlib.pufferl:main"

[project.urls]
Homepage = "https://puffer.ai"

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Build a single PyO3 cdylib that lives at `pufferlib/bindings.<tag>.so`.
# The Python package itself sits at the repo root in `pufferlib/`.
module-name = "pufferlib.bindings"
python-source = "."
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]
# Map binaries shipped with the wheel.
include = [
    { path = "pufferlib/resources/**/*", format = ["sdist", "wheel"] },
    { path = "pufferlib/config/**/*.ini", format = ["sdist", "wheel"] },
    { path = "LICENSE", format = "sdist" },
    { path = "RUST_README.md", format = "sdist" },
    { path = "cuda/**/*", format = "sdist" },
    { path = "build.rs", format = "sdist" },
]
exclude = [
    { path = "target/**/*", format = ["sdist", "wheel"] },
    { path = "Cargo.lock", format = "wheel" },
]

[tool.uv]
no-build-isolation-package = ["torch"]
